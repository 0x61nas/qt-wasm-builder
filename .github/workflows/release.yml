name: Create a Release

on:
  push:
    tags:
      - '*-*-*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
