name: Docker Automated Builds

on:
  push:
    branches:
      - aurora
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - aurora

permissions:
  packages: write
  contents: read

jobs:
  docker:
    name: Docker Build and Push (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [singlethread, multithread]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            anaselgarhy/qt-wasm-builder
            ghcr.io/${{ github.repository_owner }}/qt-wasm-builder
          tags: |
            type=raw,value=${{ matrix.variant }},priority=1000
            type=sha,prefix=${{ matrix.variant }}-
            type=semver,pattern={{version}},prefix=${{ matrix.variant }}-
            type=semver,pattern={{major}}.{{minor}},prefix=${{ matrix.variant }}-
            type=schedule,prefix=${{ matrix.variant }}-

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Cache Docker layers
        uses: actions/cache@v5
        with:
          path: /tmp/.buildx-cache-${{ matrix.variant }}
          key: ${{ runner.os }}-buildx-${{ matrix.variant }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ matrix.variant }}-

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: anaselgarhy
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: ./Dockerfile
          build-args: |
            VARIANT=${{ matrix.variant }}
          platforms: linux/amd64,linux/arm64
          builder: ${{ steps.buildx.outputs.name }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          sbom: true
          provenance: true
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=local,src=/tmp/.buildx-cache-${{ matrix.variant }}
          cache-to: type=local,dest=/tmp/.buildx-cache-${{ matrix.variant }}

      - name: Update repo description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5
        with:
          username: anaselgarhy #${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
          repository: anaselgarhy/qt-wasm-builder
          readme-filepath: ./README.md # repo root

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}
