name: Create a Release

on:
  push:
    tags:
      - '*-*-*'
  workflow_dispatch:

jobs:
  release:
    runs-on: anas-local-action-runner
    steps:
      - uses: actions/checkout@v7

      - name: Create release
        id: create_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_URL: ${{ github.api_url || format('{0}/api/v1', github.server_url) }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "Creating release for tag ${TAG}..."
          RESPONSE=$(curl -sS -w "\n%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            "${API_URL}/repos/${{ github.repository }}/releases" \
            -d "$(jq -n --arg tag "$TAG" --arg notes "$TAG" '{tag_name: $tag, name: $tag, body: "Release \($tag)"}')")

          HTTP_CODE="$(echo "$RESPONSE" | tail -1)"
          BODY="$(echo "$RESPONSE" | sed '$d')"

          if [ "$HTTP_CODE" != "201" ]; then
            echo "Failed to create release. HTTP $HTTP_CODE"
            echo "$BODY"
            exit 1
          fi

          UPLOAD_URL="$(echo "$BODY" | jq -r '.upload_url' | sed 's/{?name,.*}//')"
          echo "upload_url=${UPLOAD_URL}" >> "$GITHUB_OUTPUT"

