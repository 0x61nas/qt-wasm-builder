<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hello Qt WASM</title>
  <style>
    html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#1e1e1e; }
    #qt_container { width:100%; height:100%; }
    #qt_loader {
      position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
      color:#ccc; font-family:sans-serif; text-align:center;
    }
    #qt_loader .spinner {
      width:40px; height:40px; margin:0 auto 16px;
      border:4px solid #444; border-top-color:#4a9eff; border-radius:50%;
      animation:spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform:rotate(360deg); } }
    #qt_loader.hidden { display:none; }
    canvas { background: #1e1e1e !important; }
  </style>
</head>
<body>
  <div id="qt_loader">
    <div class="spinner"></div>
    <div>Loading Qt WASM App…</div>
  </div>
  <div id="qt_container"></div>
  <script>
    function startApp() {
      HelloWasm({
        qtContainerElements: [document.getElementById('qt_container')],
        locateFile: function(f) { return f; },
        onRuntimeInitialized: function() {
          document.getElementById('qt_loader').classList.add('hidden');
        }
      });
    }
  </script>
  <script src="hellowasm.js" onload="startApp()"></script>
</body>
</html>
